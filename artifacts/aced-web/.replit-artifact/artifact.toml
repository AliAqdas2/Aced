kind = "web"
previewPath = "/"
title = "Aced — Creator Marketplace"
version = "1.0.0"
id = "artifacts/aced-web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24285

[services.development]
run = "pnpm --filter @workspace/aced-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aced-web", "run", "build" ]
serve = "static"
publicDir = "artifacts/aced-web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24285"
BASE_PATH = "/"
