kind = "mobile"
previewPath = "/mobile/"
title = "Aced Mobile"
version = "1.0.0"
id = "artifacts/aced-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18832

[services.development]
run = "pnpm --filter @workspace/aced-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aced-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/aced-mobile", "run", "serve" ]

[services.env]
PORT = "18832"
BASE_PATH = "/mobile/"
